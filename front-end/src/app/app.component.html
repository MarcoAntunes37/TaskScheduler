<main>
    <mat-toolbar class="topnav-container">
        <button mat-icon-button (click)="drawer.toggle()">
            <span class="material-symbols-outlined menu-icon">menu</span>
        </button>
        <a href="/home" class="logo-link" routerLink="/home">
            <img class="logo" src="logo.svg" alt="">
            <span class="logo-title">Task Scheduler</span>
        </a>
        <span class="spacer"></span>
        <span (click)="getProfileLink()" class="topnav-username"> {{userProfile?.username | uppercaseFirstLetter}}</span>
        <button mat-icon-button (click)="logout()">
            <span class="material-symbols-outlined logout-icon">logout</span>
        </button>
    </mat-toolbar>
    <mat-drawer-container class="sidenav-container" autosize>
        <mat-drawer #drawer class="sidenav-drawer" mode="side">
            <ul class="sidenav-list">
                <a routerLink="/tasks" href="/tasks">
                    <li class="sidenav-item">
                        <span class="material-symbols-outlined">task</span>
                        <span>Tasks</span>
                    </li>
                </a>
                <a routerLink="/scheduler" href="/scheduler">
                    <li class="sidenav-item">
                        <span class="material-symbols-outlined">schedule</span>
                        <span>Schedule</span>
                    </li>
                </a>
            </ul>
        </mat-drawer>
        <div class="sidenav-content" (click)="drawer.close()">
            <router-outlet></router-outlet>
        </div>
    </mat-drawer-container>
</main>
