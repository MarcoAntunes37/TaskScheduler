services:
  task-db:
    image: postgres:17
    container_name: task-db
    hostname: task-db
    ports:
      - ${TASK_DB_HOST_PORT}:${TASK_DB_CONTAINER_PORT}
    environment:
      POSTGRES_USER: ${TASK_DB_USER}
      POSTGRES_PASSWORD: ${TASK_DB_PASSWORD}
      POSTGRES_DB: ${TASK_DB_NAME}
    volumes:
      - ./data/task-db:/var/lib/postgresql/data

  keycloak:
    build:
      context: ./docker/keycloak/realms
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.1.3
    command: [ "start-dev", "--import-realm" ]
    environment:
      DB_VENDOR: ${KC_DB_VENDOR}
      DB_ADDR: ${KC_DB_ADDR}
      DB_URL: ${KC_DB_URL}
      DB_DATABASE: ${KC_DB_NAME}
      DB_USER: ${KC_DB_USERNAME}
      DB_PASSWORD: ${KC_DB_PASSWORD}
      DB_HOST_NAME: ${KC_HOST_NAME}
      DB_HOST_PORT: ${KC_HOST_PORT}
      KEYCLOAK_ADMIN: ${KC_ADMIN_USERNAME}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
    ports:
      - "${KC_HOST_PORT}:${KC_CONTAINER_PORT}"
    volumes:
      - ./docker/keycloak/realms/:/opt/keycloak/data/import/
      - ./docker/keycloak/providers/:/opt/keycloak/providers/
    depends_on:
      - keycloak-db

  keycloak-db:
    image: postgres:17
    container_name: keycloak-db
    hostname: keycloak-db
    ports:
      - ${KEYCLOAK_DB_HOST_PORT}:${KEYCLOAK_DB_CONTAINER_PORT}
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
    volumes:
      - ./data/keycloak-db:/var/lib/postgresql/data

  scheduler-db:
    image: postgres:17
    container_name: scheduler-db
    hostname: scheduler-db
    ports:
      - ${SCHEDULER_DB_HOST_PORT}:${SCHEDULER_DB_CONTAINER_PORT}
    environment:
      POSTGRES_USER: ${SCHEDULER_DB_USER}
      POSTGRES_PASSWORD: ${SCHEDULER_DB_PASSWORD}
      POSTGRES_DB: ${SCHEDULER_DB_NAME}
    volumes:
      - ./data/scheduler-db:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4.0-management
    container_name: rabbitmq
    hostname: rabbitmq
    ports:
      - ${RABBITMQ_HOST_PORT}:${RABBITMQ_CONTAINER_PORT}
      - ${RABBITMQ_MANAGEMENT_HOST_PORT}:${RABBITMQ_MANAGEMENT_CONTAINER_PORT}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    command: >
      sh -c "rabbitmq-server"
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq

  mailgog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    hostname: mailhog
    ports:
      - ${MAILHOG_SMTP_HOST_PORT}:${MAILHOG_SMTP_CONTAINER_PORT}
      - ${MAILHOG_MANAGER_HOST_PORT}:${MAILHOG_MANAGER_CONTAINER_PORT}
